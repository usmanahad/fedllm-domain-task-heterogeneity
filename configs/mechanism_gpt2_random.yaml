name: continuation-gpt2-random-initialization-control
track: controlled
seed: 42
num_clients: 16
rounds: 8
regimes: [iid, domain_only]
aggregators: [fedex_lora]

data:
  tasks: [continuation]
  datasets:
    general: flwrlabs/alpaca-gpt4
    finance: flwrlabs/fingpt-sentiment-train
    medical: flwrlabs/medical-meadow-medical-flashcards
    code: flwrlabs/code-alpaca-20k
  revisions: {}
  counts: {train: 512, validation: 128, test: 256}

model:
  # The tokenizer and architecture are loaded from the same checkpoint, but all
  # model weights are initialized from the GPT-2 config.
  id: openai-community/gpt2
  random_init: true
  quantization_bits: null
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets: [c_attn]

train:
  learning_rate: 0.0002
  batch_size: 4
  local_steps: 10
  max_length: 256
  weight_decay: 0.0
  gradient_clip_norm: 1.0

analysis: {equivalence_margin: -0.05, worst_cell_margin: -0.10}
