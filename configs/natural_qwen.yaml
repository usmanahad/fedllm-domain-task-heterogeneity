name: natural-flowertune-qwen-0.5b
track: natural
seed: 42
num_clients: 16
rounds: 8
# The natural track uses domain-only for the main experiment. IID is retained
# as a matched reference over the same original instruction-response rows.
regimes: [iid, domain_only]
aggregators: [fedex_lora, factor_fedavg]

data:
  tasks: [native]
  datasets:
    general: flwrlabs/alpaca-gpt4
    finance: flwrlabs/fingpt-sentiment-train
    medical: flwrlabs/medical-meadow-medical-flashcards
    code: flwrlabs/code-alpaca-20k
  revisions: {}
  counts:
    train: 512
    validation: 128
    test: 256

model:
  id: Qwen/Qwen2.5-0.5B-Instruct
  quantization_bits: null
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets: [q_proj, v_proj]

train:
  learning_rate: 0.0002
  batch_size: 4
  local_steps: 10
  max_length: 512
  weight_decay: 0.0
  gradient_clip_norm: 1.0

analysis:
  equivalence_margin: -0.05
  worst_cell_margin: -0.10
