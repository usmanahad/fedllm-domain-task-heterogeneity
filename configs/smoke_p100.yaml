name: smoke-qwen-0.5b-p100
track: controlled
seed: 42
num_clients: 8
rounds: 1
regimes: [coupled]
aggregators: [fedex_lora]

data:
  tasks: [continuation, span_reconstruction]
  datasets:
    general: flwrlabs/alpaca-gpt4
    finance: flwrlabs/fingpt-sentiment-train
    medical: flwrlabs/medical-meadow-medical-flashcards
    code: flwrlabs/code-alpaca-20k
  revisions: {}
  counts: {train: 16, validation: 4, test: 4}

model:
  id: Qwen/Qwen2.5-0.5B-Instruct
  quantization_bits: null
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets: [q_proj, v_proj]

train:
  learning_rate: 0.0002
  batch_size: 1
  eval_batch_size: 1
  local_steps: 1
  max_length: 256
  weight_decay: 0.0
  gradient_clip_norm: 1.0

analysis:
  equivalence_margin: -0.05
  worst_cell_margin: -0.10
  diagnostic_rounds: [1]
  probe_examples_per_cell: 2

